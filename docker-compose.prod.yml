version: '3.8'

services:
  # 1. MongoDB Database
  mongo:
    image: mongo:7.0
    container_name: agriglobal-mongo
    restart: always
    environment:
      MONGO_INITDB_DATABASE: agri_marketplace
    volumes:
      - mongo-data:/data/db
      - ./logs/mongo-backup:/backup
    networks:
      - agri-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 2. Python AI & ML Microservice
  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: agriglobal-ai
    restart: always
    environment:
      - PORT=8000
    networks:
      - agri-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3

  # 3. Node.js Express Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: agriglobal-backend
    restart: always
    depends_on:
      mongo:
        condition: service_healthy
      ai-service:
        condition: service_healthy
    environment:
      - NODE_ENV=production
      - PORT=5000
      - MONGODB_URI=mongodb://mongo:27017/agri_marketplace
      - AI_SERVICE_URL=http://ai-service:8000
      - CLIENT_ORIGIN=${CLIENT_ORIGIN:-http://localhost}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRES_IN=7d
      - UPLOAD_STORAGE=disk
      - RAZORPAY_KEY_ID=${RAZORPAY_KEY_ID:-rzp_live_placeholder}
      - RAZORPAY_KEY_SECRET=${RAZORPAY_KEY_SECRET:-rzp_secret_placeholder}
      - RAZORPAY_WEBHOOK_SECRET=${RAZORPAY_WEBHOOK_SECRET:-webhook_secret_placeholder}
      - PLATFORM_COMMISSION_PERCENT=5
    volumes:
      - backend-uploads:/app/uploads
      - ./logs/backend:/app/logs
    networks:
      - agri-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3

  # 4. Frontend Web App (Nginx Reverse Proxy)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: agriglobal-frontend
    restart: always
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${PORT:-80}:80"
    networks:
      - agri-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/"]
      interval: 20s
      timeout: 5s
      retries: 3

networks:
  agri-network:
    driver: bridge

volumes:
  mongo-data:
    driver: local
  backend-uploads:
    driver: local
